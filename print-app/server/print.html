<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הדפסת מדבקות</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  label { font-weight: bold; display: block; margin-top: 12px; }
  input[type=text] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
  .result { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 8px; cursor: pointer; }
  .result:hover { background: #f5f5f5; }
  .selected { background: #eef6ff; border-color: #4a90d9; }
  .error-msg { color: #c0392b; margin-top: 8px; }
  .hint-msg { color: #777; margin-top: 8px; }
  .actions { margin-top: 16px; display: none; }
  .actions.visible { display: block; }
  button { padding: 10px 16px; font-size: 15px; margin-inline-end: 8px; margin-top: 8px; cursor: pointer; }
  input[type=number] { width: 80px; padding: 8px; font-size: 15px; }
  .checkbox-row { margin-top: 10px; font-weight: normal; display: flex; align-items: center; gap: 6px; }
  #status { margin-top: 12px; font-weight: bold; }
  .kosher-divider { margin-top: 14px; padding-top: 10px; border-top: 1px solid #ddd; }
</style>
</head>
<body>

<h1>הדפסת מדבקות</h1>

<label for="apiKey">מפתח גישה:</label>
<input type="password" id="apiKey" placeholder="מפתח שקיבלת מהמנהל (נשמר בדפדפן הזה)" autocomplete="off">

<label for="requesterName">שם המזמין:</label>
<input type="text" id="requesterName" placeholder="השם שלך">

<label for="search">חיפוש פריט:</label>
<input type="text" id="search" placeholder="מקט, ברקוד או שם מוצר... (מחפש אוטומטית, אין צורך בכפתור)">
<div id="results"></div>

<div class="actions" id="actions">
  <div id="typeChoice">
    <p>לאיזה סוג מדבקה?</p>
    <!-- הכפתורים נבנים מ-/label-types (label_types.json בשרת) -->
    <div id="typeButtons"></div>
  </div>
  <div id="qtyChoice" style="display:none">
    <p>כמות מדבקות להדפסה:</p>
    <input type="number" id="qty" min="1" value="1">
    <div class="checkbox-row" id="skipDatesRow">
      <input type="checkbox" id="skipDates">
      <label for="skipDates" style="display:inline; font-weight:normal;">הדפס ללא תאריכים</label>
    </div>
    <button onclick="doPrint()">הדפס</button>
  </div>
</div>

<div id="status"></div>

<script>
// אין כאן יותר סוד HMAC. כל משתמש מזין פעם אחת מפתח גישה אישי (מתוך
// API_KEYS בקובץ ה-.env של השרת), והוא נשמר בדפדפן ונשלח בכותרת X-Api-Key.
const API_KEY_STORAGE = "printApiKey";
const apiKeyInput = document.getElementById("apiKey");
try { apiKeyInput.value = localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) {}
apiKeyInput.addEventListener("change", () => {
  try { localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim()); } catch (e) {}
});
function apiKey() { return apiKeyInput.value.trim(); }
const BAD_KEY_MSG = "מפתח הגישה חסר או שגוי - בדקו את השדה \"מפתח גישה\".";

const WEBHOOK_URL = window.location.origin + "/webhook";
const ITEMS_URL = window.location.origin + "/items";

// סוגי המדבקות מגיעים מהשרת (label_types.json) - סוג חדש מוסיפים שם, לא כאן.
// הרשימה הזו משמשת רק אם השרת לא החזיר רשימה.
const FALLBACK_LABEL_TYPES = [
  { key: "bags", name: "שקיות", templateKey: "standalone_bags", labelType: "package",
    fields: ["sku", "product", "barcode", "kosher", "passover", "weight"], dates: true },
  { key: "cartons", name: "קרטונים", templateKey: "standalone_cartons", labelType: "carton",
    fields: ["sku", "product", "barcode", "kosher", "passover", "packagesInfo"], dates: true },
  { key: "kosher_landa", name: "כשרות לנדא", templateKey: "standalone_kosher_landa", labelType: "kosher",
    fields: ["sku", "product"], dates: false, group: "תוויות כשרות" },
  { key: "kosher_badatz", name: "כשרות בד\"ץ", templateKey: "standalone_kosher_badatz", labelType: "kosher",
    fields: ["sku", "product"], dates: false, group: "תוויות כשרות" },
];
const CARTONS_ONLY_KEY = "cartons";
let labelTypes = FALLBACK_LABEL_TYPES;

// כפתורים לפי קבוצות (group ב-label_types.json), בסדר שבו הקבוצות מופיעות ברשימה
function renderTypeButtons() {
  const wrap = document.getElementById("typeButtons");
  wrap.innerHTML = "";
  if (!labelTypes.length) {
    wrap.innerHTML = '<p class="hint-msg">אין לך הרשאה להדפיס מדבקות. פנה למנהל.</p>';
    return;
  }
  const groups = [];
  labelTypes.forEach(t => {
    const g = t.group || "";
    let entry = groups.find(x => x.group === g);
    if (!entry) { entry = { group: g, types: [] }; groups.push(entry); }
    entry.types.push(t);
  });
  groups.forEach(g => {
    const box = document.createElement("div");
    if (g.group) {
      box.className = "kosher-divider";
      const title = document.createElement("p");
      title.textContent = g.group + ":";
      box.appendChild(title);
    }
    g.types.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.name;
      b.onclick = () => selectType(t.key);
      box.appendChild(b);
    });
    wrap.appendChild(box);
  });
}

async function loadLabelTypes() {
  try {
    const res = await fetch(window.location.origin + "/label-types", { headers: { "X-Api-Key": apiKey() } });
    if (res.ok) {
      const list = await res.json();
      // רשימה ריקה = למשתמש אין הרשאה לאף סוג מדבקה (allowedUsers בשרת)
      if (Array.isArray(list)) labelTypes = list;
    }
  } catch (e) {}
  renderTypeButtons();
}
renderTypeButtons();
loadLabelTypes();
apiKeyInput.addEventListener("change", loadLabelTypes);

function typeByKey(key) { return labelTypes.find(t => t.key === key) || null; }

let selectedItem = null;
let selectedType = null;
let searchTimer = null;

document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => search(q), 300);
});

async function search(q) {
  const resultsEl = document.getElementById("results");
  if (q.length < 2) {
    resultsEl.innerHTML = '<p class="hint-msg">הקלידו לפחות 2 תווים לחיפוש</p>';
    return;
  }

  resultsEl.innerHTML = '<p class="hint-msg">מחפש...</p>';

  try {
    const res = await fetch(`${ITEMS_URL}?q=${encodeURIComponent(q)}`, {
      headers: { "X-Api-Key": apiKey() }
    });

    if (res.status === 401) {
      resultsEl.innerHTML = `<p class="error-msg">${BAD_KEY_MSG}</p>`;
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      resultsEl.innerHTML = `<p class="error-msg">שגיאת שרת: ${err.error || res.status}</p>`;
      return;
    }

    const items = await res.json();

    if (!Array.isArray(items) || items.length === 0) {
      resultsEl.innerHTML = '<p class="hint-msg">לא נמצאו תוצאות</p>';
      return;
    }

    resultsEl.innerHTML = "";
    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "result";
      div.textContent = `${item.product} | מקט: ${item.sku} | ברקוד: ${item.barcode || "-"} | כשרות: ${item.kosher || "-"}`;
      div.onclick = () => selectItem(item, div);
      resultsEl.appendChild(div);
    });
  } catch (e) {
    resultsEl.innerHTML = `<p class="error-msg">שגיאת רשת: ${e.message}</p>`;
  }
}

function selectItem(item, el) {
  document.querySelectorAll(".result").forEach(r => r.classList.remove("selected"));
  el.classList.add("selected");
  selectedItem = item;
  selectedType = null;

  document.getElementById("actions").classList.add("visible");
  document.getElementById("qtyChoice").style.display = "none";
  document.getElementById("status").textContent = "";
  document.getElementById("skipDates").checked = false;

  if (item.cartonsOnly) {
    selectType(CARTONS_ONLY_KEY);
  } else {
    document.getElementById("typeChoice").style.display = "block";
  }
}

function selectType(type) {
  selectedType = type;
  document.getElementById("typeChoice").style.display = "none";
  document.getElementById("qtyChoice").style.display = "block";
  // לתבנית בלי תאריכים (למשל תוויות כשרות) לא מציגים את התיבה
  const t = typeByKey(type);
  document.getElementById("skipDatesRow").style.display = t && t.dates ? "flex" : "none";
}

// שולחים לתבנית רק את השדות שהסוג מבקש (fields ב-label_types.json)
function buildLabelData(item, t) {
  const data = {};
  t.fields.forEach(f => { data[f] = item[f] == null ? "" : String(item[f]); });
  return data;
}

async function doPrint() {
  const statusEl = document.getElementById("status");
  const quantity = parseInt(document.getElementById("qty").value, 10);
  const requestedBy = document.getElementById("requesterName").value.trim();
  const skipDates = document.getElementById("skipDates").checked;

  if (!requestedBy) {
    statusEl.textContent = "נא למלא שם מזמין לפני ההדפסה.";
    return;
  }
  const t = typeByKey(selectedType);
  if (!selectedItem || !t || !quantity || quantity < 1) {
    statusEl.textContent = "חסרים נתונים - בחרו פריט, סוג מדבקה וכמות תקינה.";
    return;
  }

  const job = {
    id: `${selectedItem.sku}-${Date.now()}`,
    labelType: t.labelType,
    templateKey: t.templateKey,
    quantity: quantity,
    requestedBy: requestedBy,
    skipDates: t.dates ? skipDates : false,
    data: buildLabelData(selectedItem, t)
  };

  const payload = JSON.stringify(job);

  statusEl.textContent = "שולח להדפסה...";

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Api-Key": apiKey()
      },
      body: payload
    });

    const result = await res.json().catch(() => ({}));

    if (res.status === 401) {
      statusEl.textContent = BAD_KEY_MSG;
    } else if (res.ok && result.status === "printed") {
      statusEl.textContent = `נשלח בהצלחה: ${quantity} מדבקות (${t.name}) - ${requestedBy}`;
    } else if (result.status === "already_handled") {
      statusEl.textContent = "עבודה זו כבר טופלה קודם.";
    } else {
      statusEl.textContent = "שגיאה: " + (result.message || result.errorCode || res.status);
    }
  } catch (e) {
    statusEl.textContent = "שגיאת רשת: " + e.message;
  }
}
</script>

</body>
</html>
